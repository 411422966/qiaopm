# Meiyetec Web — Nginx 配置（容器内）
# 职责：
#   1. SPA fallback（所有非 /api 非静态资源的请求 → index.html）
#   2. /api 反代到后端 api 服务（容器名 api，端口 8080）
#   3. 静态资源缓存（assets/ 长期哈希缓存，index.html 不缓存）
#   4. 安全头（X-Frame-Options / X-Content-Type-Options）
#
# ⚠️ dev 模式（vite dev server 5173）下不走此配置，由 vite.config.ts 处理
#    此文件仅用于 docker / 生产 nginx 部署

server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip 压缩文本资源
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml+rss image/svg+xml;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 静态资源长期缓存（Vite 输出已带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # /api 反代到后端 api 容器
    #   - 容器内 backend 服务名（docker compose service name）固定为 "api"
    #   - 后端真实路径不带 /api 前缀，代理时去掉 /api
    #   - WebSocket 预留（如未来需要实时通知）
    location /api/ {
        proxy_pass         http://api:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering    off;
    }

    # SPA fallback：所有非文件请求 → index.html
    #   - 已存在的静态文件直接返回
    #   - /api 已在上方反代，不会触发 fallback
    location / {
        try_files $uri $uri/ /index.html;
        # index.html 不缓存（保证发布后用户立即拿到新版本）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 健康端点（供 compose / K8s liveness）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}