  #   email_configs:
  #     - to: 'oncall@meiyetec.com'
  #       headers:
  #         subject: '銆恵{ .Status | toUpper }}銆憑{ .GroupLabels.alertname }}'
  #       send_resolved: true

# ====================================================================
# 鎶戝埗瑙勫垯锛圛nhibit Rules锛?
# 褰?critical 鍛婅瀛樺湪鏃讹紝鎶戝埗鍚?service 鐨?warning 鍛婅锛堝噺灏戝櫔闊筹級
# 鍓嶆彁锛歝ritical 鍜?warning 鍛婅蹇呴』鏈夌浉鍚岀殑 group_by 鏍囩
# ====================================================================
inhibit_rules:
  # 褰撳悓 service + tier 鐨?severity=critical 鍛婅瑙﹀彂鏃?
  # 鎶戝埗鍚?service + tier 鐨?severity=warning 鍛婅
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    # 鎶戝埗鑼冨洿锛歴ervice + tier 鐩稿悓鎵嶆姂鍒?
    equal: ['service', 'tier']
    # 濡傛灉 critical 鍜?warning 鐨?alertname 涔熺浉鍚屽垯涓嶆姂鍒讹紙璁╁悓鍚嶅憡璀﹂兘鍙戯級
    # 娉ㄦ剰锛氳繖閲?equal 鍙寘鍚?service + tier锛屼笉鍚?alertname
