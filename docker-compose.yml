# =============================================================================
# Meiyetec — 本地开发 / 单机演示用 docker-compose 完整栈
# 适用：本地一键启动 (mysql + redis + api + web)
# 不适用：生产环境（生产走 K8s / 蓝绿部署，详见 docs/DEPLOY-SOP.md §2）
#
# 启动：
#   1) cd project (root)
#   2) docker compose up -d              # 启动全栈
#   3) docker compose logs -f api web    # 观察启动日志
#
# 端口：
#   - mysql      宿主 3307 → 容器 3306  （⚠️ 占用先停本地 MySQL：netstat -ano | findstr :3307）
#   - redis      宿主 6379 → 容器 6379
#   - api        宿主 8080 → 容器 8080  （注意与本地 8080 冲突！）
#   - web        宿主 8088 → 容器 80    （nginx 反代 /api → api:8080）
#
# ENV 注入策略：
#   - compose 顶层 env_file 引用 .env（仓库未提交，仅本地示例见 .env.example）
#   - 各 service 内 ${VAR:-default} 形式：prod 关键项给空 default 触发 Spring 友好 fail-fast
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-meiyetec}

services:

  # ---------------------------------------------------------------------------
  # MySQL 8.0
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: meiyetec-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meiyetec}
      TZ: Asia/Shanghai
    ports:
      # 宿主 3307 → 容器 3306（避开本机常驻 MySQL 3306 端口冲突）
      # 如提示 3307 已占用：netstat -ano | findstr :3307 → 杀掉占用进程 / 停本地 MySQL 服务
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 启动时按顺序执行初始化 SQL（init_m*.sql + init_migration_*.sql）
      # 顺序由文件名字典序保证（init_m01_auth.sql < init_m02_basic.sql < ...）
      # 首次启动执行，后续启动 mysql 已建表会忽略 IF NOT EXISTS
      - ./backend/src/main/resources/db/sql:/docker-entrypoint-initdb.d:ro
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=500
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - meiyetec-net

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: meiyetec-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - meiyetec-net

  # ---------------------------------------------------------------------------
  # Backend API（Spring Boot 3.1.5 + JRE 17，镜像标签 ${TAG:-dev}）
  # ---------------------------------------------------------------------------
  api:
    image: meiyetec/api:${TAG:-dev}
    container_name: meiyetec-api
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # === Spring Boot Profile ===
      SPRING_PROFILES_ACTIVE: prod

      # === DataSource（prod 关键项，空 default → 隐式 fail-fast）
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}

      # === Redis ===
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}

      # === 应用基础 ===
      APP_DCEP_MODE: ${APP_DCEP_MODE:-prod}
      APP_ID_GENERATOR_WORKER_ID: ${APP_ID_GENERATOR_WORKER_ID:-1}
      APP_ID_GENERATOR_DATACENTER_ID: ${APP_ID_GENERATOR_DATACENTER_ID:-1}

      # === JWT（强烈建议覆盖）===
      JWT_SECRET: ${JWT_SECRET:-}

      # === 支付 / 财税 ===
      PAY_ENV_MODE: ${PAY_ENV_MODE:-production}
      FISCAL_MODE: ${FISCAL_MODE:-baiwang}

      # === 插件外挂卷 ===
      PLUGIN_PLUGINS_ROOT: /opt/plugins
      PLUGIN_RUNTIME_ENABLED: ${PLUGIN_RUNTIME_ENABLED:-true}
      PLUGIN_AUTOLOAD: ${PLUGIN_AUTOLOAD:-false}

      # === Flyway 临时禁用（Gate 3 批次 1.4a 绕路）已移除 ===
      # 修复：见 audit/issues/I010 + I102 — V1 加 UTF-8 BOM + spring.flyway.encoding=UTF-8
      # 2026-10-15 Gate 3 批次 2.1：I010 修复完成，FLYWAY_ENABLED=false 绕路删除
      # 现在依赖 application.yml base 的 enabled: ${FLYWAY_ENABLED:true} 默认开启

      # === 日志时区 ===
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      # 插件外挂卷：宿主 ./plugins → 容器 /opt/plugins
      # 部署新插件直接 cp 到 ./plugins/<code>/<version>/，重启 api 自动加载
      - ./plugins:/opt/plugins:rw
    healthcheck:
      # /actuator/health 由 P0-A 引入的 spring-boot-starter-actuator 提供
      # start_period=60s 给 JVM 启动留 buffer（Sprint Boot + Flyway 启动常 > 30s）
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - meiyetec-net

  # ---------------------------------------------------------------------------
  # Frontend Web（Vue 3 + Vite SPA，nginx:alpine 反代 /api → api:8080）
  # ---------------------------------------------------------------------------
  web:
    image: meiyetec/web:${TAG:-dev}
    container_name: meiyetec-web
    restart: unless-stopped
    build:
      context: ./frontend/meiyetec-web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - meiyetec-net

# =============================================================================
# 网络 / 卷
# =============================================================================
networks:
  meiyetec-net:
    name: ${COMPOSE_PROJECT_NAME:-meiyetec}_meiyetec-net
    driver: bridge

volumes:
  mysql-data:
    external: true
    name: qiaopm_mysql-data
  redis-data:
    external: true
    name: qiaopm_redis-data